name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Pillow is the one optional extra the tests exercise (logo
      # normalisation). The SVG extras in requirements.txt need a C build of
      # pycairo and are not needed to test.
      - name: Install
        run: pip install -e . pytest ruff pillow
      - name: Lint
        run: ruff check .
      # Offline and synthetic: conftest.py points the suite at a temporary
      # cache, so no credentials or network access are needed.
      - name: Test
        run: python -m pytest -q
